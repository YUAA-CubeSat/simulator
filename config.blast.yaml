simulation:
  mode: hitl                  # sitl or hitl
  clock: realtime            # simulated or realtime; hitl requires realtime
  start_utc: "2026-09-18T00:00:00Z"
  max_realtime_lag_s: 0.5
  duration_s: 21600 # 6 hours # 172800.0         # 48 hours
  step_s: 0.01 # 0.01
  magnetometer_period_s: 0.01
  accelerometer_period_s: 0.01
  gyroscope_period_s: 0.01
  control_period_s: 0.01
  sun_period_s: 1.0
  field_period_s: 0.4         # WMM update period
  seed: 42
  output_csv: telemetry.csv
  telemetry_period_s: 1.0
  checkpoint_steps: 1000      # sync CSV every N dynamics steps; 0 disables

orbit:
  # Representative ISS deployment orbit: circular, 400 km altitude, 51.6 deg inclination.
  # ISS reference: https://www.nasa.gov/reference/international-space-station/
  # ECI J2000 approximation: RAAN = 0 deg, starting at the ascending node.
  # Speed = sqrt(earth_mu_m3_s2 / (earth_radius_m + 400000)); period ~92.56 min.
  # Nominal orbit, not the ISS ephemeris at start_utc; deployment impulse omitted.
  position_m: [6778137.0, 0.0, 0.0]
  velocity_m_s: [0.0, 4763.307889, 6009.798869]
  attitude_mrp: [0.1, -0.05, 0.02]
  angular_rate_rad_s: [0.09, -0.09, 0.09]

spacecraft:
  bus_mass_kg: 2.0
  bus_inertia_kg_m2: [[0.012, 0.0, 0.0], [0.0, 0.010, 0.0], [0.0, 0.0, 0.008]]
  magnetorquer_max_dipole_Am2: [0.2, 0.2, 0.2]
  nominal_power_W: 0.9     # example constant bus load; independent of all activity
  battery_capacity_Wh: 10.0   # usable capacity
  battery_initial_soc: 0.8  # initial state of charge, fraction in [0, 1] # Assume 80% as default storage charge
  magnetorquer_max_power_W: [0.16, 0.16, 0.25]  # X/Y/Z, at max absolute dipole
  solar_charging:
    irradiance_W_m2_at_1au: 1361.0
    conversion_efficiency: 0.95  # wiring / MPPT / regulator, panel to bus
    battery_charge_efficiency: 0.95  # bus surplus to stored energy
    max_charge_power_W: 2.6  # charger input limit, after supplying nominal + actuator loads
    # Active cell area, outward body normal, cell electrical efficiency.
    # Example: six body-mounted faces; [] disables solar generation.
    # panels:
    #  - {normal_body: [1, 0, 0], area_m2: 0.0112, efficiency: 0.30}
    #  - {normal_body: [-1, 0, 0], area_m2: 0.0112, efficiency: 0.30}
    #  - {normal_body: [0, 1, 0], area_m2: 0.0112, efficiency: 0.30}
    #  - {normal_body: [0, -1, 0], area_m2: 0.0084, efficiency: 0.30} # one missing cell
    panels:
      - {normal_body: [1, 0, 0], area_m2: 0.0056, efficiency: 0.30}
      - {normal_body: [-1, 0, 0], area_m2: 0.0056, efficiency: 0.30}
      - {normal_body: [0, 1, 0], area_m2: 0.0056, efficiency: 0.30}
      - {normal_body: [0, -1, 0], area_m2: 0.0056, efficiency: 0.30} # one missing cell
  boom:
    tip_mass_kg: 0.15
    axis_body: [0.0, 0.0, 1.0]
    initial_length_m: 0.0
    min_length_m: 0.0
    max_length_m: 3.0
    max_speed_m_s: 0.05

environment:
  sun_radius_m: 6.957e8     # finite solar disk for umbra/penumbra
  earth_radius_m: 6378137.0
  earth_mu_m3_s2: 3.986004418e+14
  wmm_coefficients: ./data/WMM2025.COF

sensors:
  # Both sensor pairs are body-aligned to match firmware identity calibration.
  magnetometers:
    - body_to_sensor: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
      bias_T: [0.0, 0.0, 0.0]
      noise_std_T: 1.0e-7
    - body_to_sensor: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
      bias_T: [0.0, 0.0, 0.0]
      noise_std_T: 1.0e-7
  accelerometers:
    # Specific force at the body reference point, in each sensor's frame.
    - body_to_sensor: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
      bias_m_s2: [0.0, 0.0, 0.0]
      noise_std_m_s2: 1.0e-3
    - body_to_sensor: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
      bias_m_s2: [0.0, 0.0, 0.0]
      noise_std_m_s2: 1.0e-3
  gyroscope:
    # One three-axis angular-rate sensor; illustrative noise per sample per axis.
    body_to_sensor: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
    bias_rad_s: [0.0, 0.0, 0.0]
    noise_std_rad_s: 1.0e-4
  sun_sensor:
    boresight_body: [1.0, 0.0, 0.0]
    half_angle_deg: 80.0
    noise_std_rad: 0.002

sitl:
  command: [./../YUAA_cubesat/emul-native.sh]   # executable and arguments; relative to this config
  startup_delay_s: 5.0       # boot grace period before sending any messages
  timeout_s: 1.0             # wall-clock response/write deadline after startup

hitl:
  port: /dev/tty.usbserial-AV0KHAEF 
  baudrate: 921600
  log_usb_rx: false
  timeout_s: 0.15
