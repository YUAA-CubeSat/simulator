simulation:
  mode: sitl                  # sitl or hitl
  clock: simulated            # simulated or realtime; hitl requires realtime
  start_utc: "2026-09-18T00:00:00Z"
  duration_s: 21600.0         # six hours
  step_s: 0.2                 # Basilisk dynamics step
  magnetometer_period_s: 0.4 # independent ADCS callback period
  accelerometer_period_s: 0.4 # independent ADCS callback period
  gyroscope_period_s: 0.4 # independent ADCS callback period
  sun_period_s: 1.0
  control_period_s: 1.0
  field_period_s: 0.4         # WMM update period
  seed: 42
  output_csv: telemetry.csv
  telemetry_period_s: 1.0
  checkpoint_steps: 1000      # sync CSV every N dynamics steps; 0 disables

orbit:
  position_m: [6878137.0, 0.0, 0.0]
  velocity_m_s: [0.0, 7612.6, 0.0]
  attitude_mrp: [0.1, -0.05, 0.02]
  angular_rate_rad_s: [0.01, -0.02, 0.015]

spacecraft:
  bus_mass_kg: 2.0
  bus_inertia_kg_m2: [[0.012, 0.0, 0.0], [0.0, 0.010, 0.0], [0.0, 0.0, 0.008]]
  magnetorquer_max_dipole_Am2: [0.2, 0.2, 0.2]
  # Example power hardware values: replace with measured flight hardware data.
  nominal_power_W: 1.0      # example constant bus load; independent of all activity
  battery_capacity_Wh: 10.0   # usable capacity
  battery_initial_soc: 0.8  # initial state of charge, fraction in [0, 1]
  magnetorquer_max_power_W: [0.5, 0.5, 0.5]  # X/Y/Z, at max absolute dipole
  solar_charging:
    irradiance_W_m2_at_1au: 1361.0
    conversion_efficiency: 0.95  # wiring / MPPT / regulator, panel to bus
    battery_charge_efficiency: 0.95  # bus surplus to stored energy
    max_charge_power_W: 5.0  # charger input limit, after supplying nominal + actuator loads
    # Active cell area, outward body normal, cell electrical efficiency.
    # Example: six body-mounted faces; [] disables solar generation.
    panels:
      - {normal_body: [1, 0, 0], area_m2: 0.01, efficiency: 0.30}
      - {normal_body: [-1, 0, 0], area_m2: 0.01, efficiency: 0.30}
      - {normal_body: [0, 1, 0], area_m2: 0.01, efficiency: 0.30}
      - {normal_body: [0, -1, 0], area_m2: 0.01, efficiency: 0.30}
      - {normal_body: [0, 0, 1], area_m2: 0.01, efficiency: 0.30}
      - {normal_body: [0, 0, -1], area_m2: 0.01, efficiency: 0.30}
  boom:
    tip_mass_kg: 0.15
    axis_body: [0.0, 0.0, 1.0]
    initial_length_m: 0.0
    min_length_m: 0.0
    max_length_m: 1.0
    max_speed_m_s: 0.05

environment:
  sun_radius_m: 6.957e8     # finite solar disk for umbra/penumbra
  earth_radius_m: 6378137.0
  earth_mu_m3_s2: 3.986004418e+14
  wmm_coefficients: ./data/WMM2025.COF

sensors:
  magnetometers:
    - body_to_sensor: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
      bias_T: [0.0, 0.0, 0.0]
      noise_std_T: 1.0e-7
    - body_to_sensor: [[0, 1, 0], [-1, 0, 0], [0, 0, 1]]
      bias_T: [0.0, 0.0, 0.0]
      noise_std_T: 1.0e-7
  accelerometers:
    # Specific force at the body reference point, in each sensor's frame.
    - body_to_sensor: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
      bias_m_s2: [0.0, 0.0, 0.0]
      noise_std_m_s2: 1.0e-3
    - body_to_sensor: [[0, 1, 0], [-1, 0, 0], [0, 0, 1]]
      bias_m_s2: [0.0, 0.0, 0.0]
      noise_std_m_s2: 1.0e-3
  gyroscope:
    # One three-axis angular-rate sensor; illustrative noise per sample per axis.
    body_to_sensor: [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
    bias_rad_s: [0.0, 0.0, 0.0]
    noise_std_rad_s: 1.0e-4
  sun_sensor:
    boresight_body: [1.0, 0.0, 0.0]
    half_angle_deg: 80.0
    noise_std_rad: 0.002

sitl:
  command: [./adcs_example]   # executable and arguments; relative to this config
  startup_delay_s: 5.0       # boot grace period before sending any messages
  timeout_s: 1.0             # wall-clock response/write deadline after startup

hitl:
  port: /dev/ttyUSB0
  baudrate: 115200           # OBC 100 Hz HITL: use 921600 and matching firmware build
  log_usb_rx: false         # enable only when diagnosing protocol errors
  timeout_s: 0.15
